# Levanta Jenkins localmente:  docker compose up -d --build   (desde esta carpeta)
# Interfaz: http://localhost:8080
services:
  jenkins:
    build: .
    image: jenkins-riesgo-credito
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home   # persistencia: jobs, plugins y configuracion

volumes:
  jenkins_home: {}
